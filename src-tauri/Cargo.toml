[package]
name = "better-mtplx-ui"
version = "0.1.0"
description = "A lightweight, parallel-first GUI for managing MTPLX model instances"
authors = ["Saman Badakhshan"]
edition = "2024"
# See more keys and definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with bin name.
name = "better_mtplx_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
anyhow = "1"
thiserror = "2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
futures = "0.3.34"

# Read optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
